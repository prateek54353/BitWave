group 'xyz.justsoft.video_thumbnail'
version '1.0-SNAPSHOT'

// The upstream 0.5.6 Android build script pins AGP 4.1 and jcenter(), which
// prevents this Flutter app from configuring on current Android Gradle Plugin.
apply plugin: 'com.android.library'

android {
    namespace 'xyz.justsoft.video_thumbnail'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}
